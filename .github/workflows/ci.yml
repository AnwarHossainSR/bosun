name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (task board and hooks)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  validate:
    name: validate (plugin, OpenSpec example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Validation is local and needs no Claude credentials.
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.301
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/bosun
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.2
      - name: Validate the OpenSpec example with OpenSpec itself
        working-directory: examples/openspec-todo-api
        env:
          OPENSPEC_TELEMETRY: "0"
        run: openspec validate add-todo-api --strict --no-interactive

  # Single required check for branch protection: fails unless every job above succeeded.
  ci:
    name: ci
    if: always()
    needs: [tests, validate]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "tests: ${{ needs.tests.result }}, validate: ${{ needs.validate.result }}"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.validate.result }}" = "success"
